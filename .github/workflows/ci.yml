name: CI

on:
  push:
    branches: [main, greenfield]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Same throwaway database shape as `pnpm e2e:setup`'s docker-compose.test.yml
    # (5435, kynite/kynite/kynite_test), so `tests/integration/**` — which
    # `describe.skipIf(!databaseUrl)` otherwise silently no-ops — actually runs
    # in the gate that `pnpm run ci` (typecheck/lint/test/build) is meant to be.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kynite
          POSTGRES_PASSWORD: kynite
          POSTGRES_DB: kynite_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U kynite -d kynite_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm run ci

  e2e:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # The e2e run needs *a* valid secret, not a shared one: generate a
      # throwaway per job instead of committing a plaintext value.
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: pnpm e2e:setup
        env:
          DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test

      - run: pnpm e2e:run
        env:
          DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test
          BETTER_AUTH_URL: http://127.0.0.1:3100

      - if: always()
        run: pnpm e2e:teardown

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
