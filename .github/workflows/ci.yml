name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Same throwaway database shape as `pnpm e2e:setup`'s docker-compose.test.yml
    # (5435, kynite/kynite/kynite_test), so `tests/integration/**` — which
    # `describe.skipIf(!databaseUrl)` otherwise silently no-ops — actually runs
    # in the gate that `pnpm run ci` (typecheck/lint/test/build) is meant to be.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kynite
          POSTGRES_PASSWORD: kynite
          POSTGRES_DB: kynite_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U kynite -d kynite_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm run ci

  e2e:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@playwright/test` is a dependency of `apps/web`, not of the root.
      - run: pnpm --filter web exec playwright install --with-deps chromium

      # The e2e run needs *a* valid secret, not a shared one: generate a
      # throwaway per job instead of committing a plaintext value.
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: pnpm e2e:setup
        env:
          DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test

      # Alpha: the functional specs gate, the snapshot comparisons do not.
      #
      # While the interface is being rebuilt, a `@visual` failure means "this
      # looks different from yesterday", which during a redesign is true of
      # every deliberate change — 18 of the 40 baselines cover the calendar and
      # Vandaag alone, both of which are open work, and the two design-system
      # shots move with any token edit. A gate that is red by design teaches you
      # to read red as normal, which is how a real break gets waved through.
      #
      # What still gates: typecheck, lint, unit tests, `next build`, the
      # Storybook build, and every e2e spec that asserts behaviour rather than
      # pixels. Those catch the failures snapshots were never catching anyway —
      # a server/client boundary error, for one, is invisible to all of the
      # above until something actually boots.
      #
      # Restore this at feature freeze: run `pnpm e2e:visual:update` once, drop
      # the flag, and the baselines are a real gate again. See `e2e/README.md`.
      - run: pnpm e2e:run --grep-invert @visual
        env:
          DATABASE_URL: postgresql://kynite:kynite@localhost:5435/kynite_test
          BETTER_AUTH_URL: http://127.0.0.1:3100

      - if: always()
        run: pnpm e2e:teardown

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
