services:
  postgres:
    image: postgres:17
    container_name: kynite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kynite
    # 5433 matches DATABASE_URL in .env.example / .env.local.
    # The e2e database lives on 5435 (docker-compose.test.yml).
    ports:
      - '5433:5432'
    volumes:
      - kynite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kynite']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kynite-postgres-data:
